<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>माझा Quiz App</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login" class="page"><div class="card">
<h1>🧠 Quiz App</h1><p>तुमचे नाव टाका</p>
<input id="name" placeholder="तुमचे नाव">
<button onclick="startQuiz()">Quiz सुरू करा</button>
</div></div>

<div id="quiz" class="page hidden"><div class="card quiz">
<div class="bar"><b>प्रश्न <span id="no">1</span>/10</b><b>⏱️ <span id="time">20</span>s</b></div>
<h2 id="q"></h2><div id="answers"></div>
<button id="next" class="next hidden" onclick="nextQ()">पुढचा प्रश्न ➜</button>
</div></div>

<div id="result" class="page hidden"><div class="card center">
<div class="trophy">🏆</div><h1>Quiz पूर्ण!</h1>
<p id="msg"></p><div id="score"></div>
<button onclick="location.reload()">पुन्हा खेळा</button>
</div></div>
<script src="script.js"></script>
</body></html>
