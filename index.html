<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>मराठी Quiz App</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<div class="app">

  <section id="homePage" class="card">
    <div class="logo">🧠</div>
    <h1>Quiz App</h1>
    <p class="subtitle">ज्ञानाची मजेदार परीक्षा!</p>
    <input id="playerName" class="nameInput" type="text" maxlength="20" placeholder="तुमचे नाव">
    <button class="primary" onclick="startQuiz()">Quiz सुरू करा</button>
    <button class="secondary" onclick="showLeaderboard()">🏆 Leaderboard</button>
  </section>

  <section id="quizPage" class="card hidden">
    <div class="topbar">
      <b id="questionNo">प्रश्न 1 / 20</b>
      <b>गुण: <span id="score">0</span></b>
    </div>
    <div class="timerCircle">
      <div>⏱️ वेळ</div>
      <strong id="timer">15</strong>
    </div>
    <div class="progress"><div id="progressBar"></div></div>
    <h2 id="question"></h2>
    <div id="options"></div>
    <button id="nextBtn" class="primary hidden" onclick="nextQuestion()">पुढचा प्रश्न ➜</button>
  </section>

  <section id="resultPage" class="card hidden">
    <div class="trophy">🏆</div>
    <h1>Quiz पूर्ण!</h1>
    <p id="resultText"></p>
    <div class="bigScore"><span id="finalScore">0</span> / <span id="totalScore">20</span></div>
    <p id="resultMessage"></p>
    <button class="primary" onclick="startQuiz()">पुन्हा खेळा</button>
    <button class="secondary" onclick="showLeaderboard()">🏆 Leaderboard</button>
    <button class="linkBtn" onclick="goHome()">मुख्य पान</button>
  </section>

  <section id="leaderboardPage" class="card hidden">
    <h1>🏆 Leaderboard</h1>
    <div id="leaderboard"></div>
    <button class="primary" onclick="goHome()">मुख्य पान</button>
  </section>

</div>
<script src="script.js?v=3"></script>
</body>
</html>
