<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz App</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<div class="app">

  <section id="startPage" class="card">
    <div class="logo">🧠</div>
    <h1>Quiz App</h1>
    <p class="subtitle">तुमचे नाव टाका आणि Quiz सुरू करा</p>
    <input id="playerName" type="text" placeholder="तुमचे नाव" maxlength="30">
    <button id="startBtn" class="primary">Quiz सुरू करा</button>
  </section>

  <section id="quizPage" class="card hidden">
    <div class="topbar">
      <span id="questionCount">प्रश्न 1 / 20</span>
      <span id="score">गुण: 0</span>
    </div>

    <div class="timer">
      <div class="timer-label">⏱️ वेळ</div>
      <div id="timer">15</div>
    </div>

    <div class="progress">
      <div id="progressBar"></div>
    </div>

    <h2 id="question">प्रश्न येथे दिसेल</h2>
    <div id="options" class="options"></div>
    <p id="message" class="message"></p>
  </section>

  <section id="resultPage" class="card hidden">
    <div class="trophy">🏆</div>
    <h1>Quiz पूर्ण!</h1>
    <p id="resultText"></p>
    <div id="finalScore" class="final-score">0 / 20</div>
    <p id="remark" class="remark"></p>
    <button id="restartBtn" class="primary">पुन्हा खेळा</button>
  </section>

</div>
<script src="script.js?v=3"></script>
</body>
</html>
